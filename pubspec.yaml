name: mottinutnutriotinist
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  provider: ^6.1.5
  http: ^1.4.0
  google_sign_in: ^6.2.1
  #conecction
  connectivity_plus: ^6.1.4
  #message
  fluttertoast: ^8.2.12
  vibration: ^3.1.3
  #animation
  lottie: ^3.1.2
  #typograpy
  font_awesome_flutter: ^10.8.0
  #imagnes svg
  flutter_svg: ^2.1.0
  #font
  google_fonts: ^6.2.1
  #carga de imagenes
  image_picker: ^1.1.2
  #permision of app
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.0

  #drowpsown search
  animated_custom_dropdown: ^3.1.1

  #validar carnet
  google_mlkit_text_recognition: ^0.12.0
  google_mlkit_object_detection: ^0.12.0
  image: ^3.3.0

  #reconocimiento de foto
  google_ml_kit: ^0.17.0

  #validar sign up
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1

  #conection robusta_events:
  dio: ^5.8.0+1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  get_it: ^8.0.3

  #skeleton
  shimmer: ^3.0.0

  #manejar calendario local
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true


  assets:

    - assets/images/security.png
    #icons of navigation
    - assets/icons/home_grey.svg
    - assets/icons/home.svg
    - assets/icons/patient_grey.svg
    - assets/icons/patient.svg
    - assets/icons/recetas_icon.svg
    - assets/icons/recetas_icon_grey.svg
    - assets/icons/profile_icon.svg
    - assets/icons/profile_icon_grey.svg
    - assets/images/logos/mottinut_logo.svg
    #iconos de login
    - assets/images/logo_google_login.png
    - assets/images/apple_logo.png
    #loading
    - assets/loading/loading_infinity.json
    #success
    - assets/lottie/succes/success.json
    - assets/nina.svg
    - assets/fut_omb.svg
    - assets/3_omb.svg
    #next icon
    - assets/images/next_icon.svg
    - assets/images/next_orange.svg
    - assets/images/notification_icon.svg
    - assets/images/menu_icon.svg
    - assets/images/next_gris.svg
    - assets/images/anterior_icon.svg
    - assets/images/gallery_icon.svg
    - assets/images/file_correct.svg
    - assets/images/check_autorization.svg
    - assets/images/icon_verificado.svg
    - assets/images/eye_icon.svg
    - assets/images/user_icon.svg
    - assets/images/candado_icon.svg
    - assets/images/alert_icon.svg
    - assets/images/user_detail.svg
