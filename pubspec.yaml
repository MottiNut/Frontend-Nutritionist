    - assets/images/iconEnf/hipertencion_icon.svg
    - assets/images/iconEnf/hiper_icon_c.svg
    - assets/images/iconEnf/obecidad_icon.svg
    - assets/images/iconEnf/obe_icon_c.svg
    - assets/images/iconEnf/other_icon.svg
