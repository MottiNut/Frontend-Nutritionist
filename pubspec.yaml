    - assets/images/message_icon.svg
    - assets/images/pen_inactive.svg
    - assets/images/pen_active.svg
    - assets/images/line_divider.svg
    #nutriotinist placeholder
    - assets/images/placeholder_nutri.jpg
    - assets/images/user_placeholder_orange.svg
    - assets/images/user_placeholder_esmer.svg
    - assets/images/plus_icon.svg
    #loading
    - assets/loading/palta_saltarina.json
    - assets/loading/empty_calendar.json

