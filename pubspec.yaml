name: mottinutnutriotinist
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  lucide_icons: ^0.257.0
  country_icons: ^2.0.1

  in_app_review: ^2.0.11

  geolocator: ^11.0.0
  geocoding: ^3.0.0

  debounce_throttle: ^2.0.0

  dropdown_flutter: ^1.0.2

  http: ^1.4.0
  # JSON serialization
  json_annotation: ^4.8.1
  http_parser: ^4.0.2

  google_sign_in: ^5.4.4
  # Firebase Core (requerido)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_messaging: ^16.0.1

  # Apple Sign In (solo iOS)
  sign_in_with_apple: ^7.0.1

  #conecction
  connectivity_plus: ^6.1.4
  #message
  fluttertoast: ^8.2.12
  vibration: ^3.1.3

  share_plus: ^7.0.0

  #animation
  lottie: ^3.1.2
  #typograpy
  font_awesome_flutter: ^10.8.0
  #imagnes svg
  flutter_svg: ^2.1.0
  #font
  google_fonts: ^6.2.1
  #carga de imagenes
  image_picker: ^1.1.2
  #permision of app
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0

  #drowpsown search
  animated_custom_dropdown: ^3.1.1

  #validar carnet
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_object_detection: ^0.15.0
  image: ^4.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.1

  #notificactions
  flutter_local_notifications: ^19.4.2

  #reconocimiento de foto
  google_ml_kit: ^0.20.0

  fl_chart: ^1.1.1

  #validar sign up
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1

  #conection robusta_events:
  dio: ^5.8.0+1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  get_it: ^8.0.3

  table_calendar: ^3.0.9
  intl: ^0.20.2

  #skeleton
  shimmer: ^3.0.0

  url_launcher: ^6.3.1

  #manejar calendario local
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/icon_blue.png"
  min_sdk_android: 21

